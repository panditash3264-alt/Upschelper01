<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC Mission Command Console v4.5</title>
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js Core Framework -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1329; }
    ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 10px; }

    /* Google Translate App Style UI Overrides */
    .goog-te-gadget-simple {
      background-color: #111a36 !important;
      border: 1px solid #1f293d !important;
      padding: 4px 8px !important;
      border-radius: 0.5rem !important;
      display: inline-flex !important;
      align-items: center !important;
    }
    .goog-te-gadget-simple .goog-te-menu-value {
      color: #9ca3af !important;
      font-size: 11px !important;
      font-family: monospace !important;
    }
    .goog-te-gadget-icon, .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }
  </style>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen font-sans antialiased"
  x-cloak
  x-data="{
    correctPin: '1234', inputPin: '', userAuthenticated: false, accessDenied: false,
    activeTab: 'dashboard', sidebarOpen: false, formattedDate: '', currentQuote: '',
    countdown: { days: '00', hours: '00', mins: '00' },

    // Targets Architecture
    dailyTargets: [], newDailyText: '',
    weeklyTargets: [], newWeeklyText: '',

    // Current Affairs & Editorials
    caNotes: [], caMonth: 'January 2026', caTopic: '', caTakeaways: '',
    editorialNotes: [], edPaper: 'The Hindu', edTopic: '', edArgs: '',

    // Government Schemes & Reports
    schemes: [], schMin: 'Ministry of Finance', schName: '', schObj: '',
    reports: [], repBody: 'World Bank', repTitle: '', repFindings: '',

    // Unified Data Bank
    dataBank: [], dbCat: 'Statistic', dbValue: '', dbRef: '',

    // Answer Writing Tracker & Evaluations
    answers: [], ansPaper: 'GS Paper 1', ansQ: '', ansStatus: 'Written',
    evalNotes: [], evalSource: 'Mock Test Paper', evalFeedback: '',

    // AI Evaluation Engine Workspace Properties
    aiQuestion: '', aiAnswer: '', aiPaper: 'GS Paper 2', aiEvaluating: false, aiFeedback: null,

    // Subject Tracking Parameters
    preHistory: 45, preGeo: 30, prePolity: 60, preEconomy: 40, preEnvSci: 25,
    mainsGS1: 20, mainsGS2: 35, mainsGS3: 15, mainsGS4: 40, anthroSyllabus: 35,

    init() {
      this.updateDateDisplay();
      this.rotateQuote();
      this.startCountdown();
      if (sessionStorage.getItem('upsc_authenticated') === 'true') {
        this.userAuthenticated = true;
        this.loadLocalData();
      }
      setInterval(() => this.startCountdown(), 60000);
    },

    verifyAccessPin() {
      if (this.inputPin === this.correctPin) {
        this.userAuthenticated = true;
        this.accessDenied = false;
        sessionStorage.setItem('upsc_authenticated', 'true');
        this.loadLocalData();
      } else {
        this.accessDenied = true;
        this.inputPin = '';
      }
    },

    logoutSession() {
      sessionStorage.removeItem('upsc_authenticated');
      this.userAuthenticated = false;
      window.location.reload();
    },

    updateDateDisplay() {
      this.formattedDate = new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    },

    rotateQuote() {
      const quotes = [
        'Don\'t watch the clock; do what it does. Keep going.',
        'The premium of excellence is absolute discipline over transient desires.',
        'Sovereignty over state begins with absolute command over your daily routine.',
        'Structure defeats chaos. Consistent iterations yield standard output numbers.'
      ];
      this.currentQuote = quotes[Math.floor(Date.now() / 86400000) % quotes.length];
    },

    startCountdown() {
      const target = new Date('May 23, 2027 09:30:00').getTime();
      const difference = target - new Date().getTime();
      if (difference > 0) {
        this.countdown.days = Math.floor(difference / 86400000) + 'd';
        this.countdown.hours = Math.floor((difference % 86400000) / 3600000) + 'h';
        this.countdown.mins = Math.floor((difference % 3600000) / 60000) + 'm';
      }
    },

    triggerAiEvaluation() {
      if (!this.aiAnswer.trim() || !this.aiQuestion.trim()) return;
      this.aiEvaluating = true;
      this.aiFeedback = null;

      setTimeout(() => {
        const text = this.aiAnswer.toLowerCase();
        const wordCount = this.aiAnswer.trim().split(/\s+/).length;

        // Perform programmatic baseline heuristic grading parameter checks
        const hasConstitutional = text.includes('article') || text.includes('constitution') || text.includes('amendment') || text.includes('judgment') || text.includes('sc ');
        const hasData = text.includes('%') || text.includes('percent') || text.includes('report') || text.includes('committee') || text.includes('niti');
        const hasStructure = wordCount >= 140 && wordCount <= 260;

        let calculatedScore = 3;
        if (hasConstitutional) calculatedScore += 2;
        if (hasData) calculatedScore += 2;
        if (wordCount >= 150) calculatedScore += 2;
        if (text.includes('way forward') || text.includes('conclusion')) calculatedScore += 1;

        this.aiFeedback = {
          score: Math.min(calculatedScore, 10),
          words: wordCount,
          structuralCheck: hasStructure ? 'Optimal Core Structure Bounds' : 'Sub-Optimal Distribution Length',
          constitutionalAnchoring: hasConstitutional ? 'Verified Anchor Present' : 'Deficient Parameter Hook',
          dataIntegration: hasData ? 'Verified Analytical Reference Data' : 'Deficient Empirical Context',
          diagnosticProse: 'The analytical syntax indicates clear core awareness. To push past benchmark targets, emphasize clear sub-headings matching answer directive instructions, amplify constitutional cross-references within body copy blocks, and close with an administrative solution index mapping to a Sustainable Development Goal metric frame.'
        };

        // Mirror feedback matrix straight into evaluations listing logs
        this.evalNotes.unshift({
          id: Date.now(),
          source: `AI Evaluator Engine (${this.aiPaper})`,
          feedback: `Q: "${this.aiQuestion.substring(0,40)}..." Generated Score Metrics: ${this.aiFeedback.score}/10. Anchor Parameters: ${this.aiFeedback.constitutionalAnchoring}. Core Recommendation: Conclude cleanly using actionable context directives.`
        });

        this.aiEvaluating = false;
        this.saveLocalData();
      }, 1500);
    },

    saveLocalData() {
      if (!this.userAuthenticated) return;
      const dataStoreObj = {
        dailyTargets: this.dailyTargets, weeklyTargets: this.weeklyTargets,
        caNotes: this.caNotes, editorialNotes: this.editorialNotes,
        schemes: this.schemes, reports: this.reports, dataBank: this.dataBank,
        answers: this.answers, evalNotes: this.evalNotes,
        preHistory: this.preHistory, preGeo: this.preGeo, prePolity: this.prePolity, preEconomy: this.preEconomy, preEnvSci: this.preEnvSci,
        mainsGS1: this.mainsGS1, mainsGS2: this.mainsGS2, mainsGS3: this.mainsGS3, mainsGS4: this.mainsGS4, anthroSyllabus: this.anthroSyllabus
      };
      localStorage.setItem('elite_upsc_secure_data_v4', JSON.stringify(dataStoreObj));
    },

    loadLocalData() {
      const saved = localStorage.getItem('elite_upsc_secure_data_v4');
      if (saved) {
        const parsed = JSON.parse(saved);
        this.dailyTargets = parsed.dailyTargets || [];
        this.weeklyTargets = parsed.weeklyTargets || [];
        this.caNotes = parsed.caNotes || [];
        this.editorialNotes = parsed.editorialNotes || [];
        this.schemes = parsed.schemes || [];
        this.reports = parsed.reports || [];
        this.dataBank = parsed.dataBank || [];
        this.answers = parsed.answers || [];
        this.evalNotes = parsed.evalNotes || [];

        this.preHistory = parsed.preHistory ?? 45; this.preGeo = parsed.preGeo ?? 30; this.prePolity = parsed.prePolity ?? 60; this.preEconomy = parsed.preEconomy ?? 40; this.preEnvSci = parsed.preEnvSci ?? 25;
        this.mainsGS1 = parsed.mainsGS1 ?? 20; this.mainsGS2 = parsed.mainsGS2 ?? 35; this.mainsGS3 = parsed.mainsGS3 ?? 15; this.mainsGS4 = parsed.mainsGS4 ?? 40; this.anthroSyllabus = parsed.anthroSyllabus ?? 35;
      }
    },

    // Mutation Handlers
    addDailyTarget() {
      if(!this.newDailyText.trim()) return;
      this.dailyTargets.unshift({ id: Date.now(), text: this.newDailyText, completed: false });
      this.newDailyText = ''; this.saveLocalData();
    },
    addWeeklyTarget() {
      if(!this.newWeeklyText.trim()) return;
      this.weeklyTargets.unshift({ id: Date.now(), text: this.newWeeklyText, completed: false });
      this.newWeeklyText = ''; this.saveLocalData();
    },
    addCaNote() {
      if(!this.caTopic.trim() || !this.caTakeaways.trim()) return;
      this.caNotes.unshift({ id: Date.now(), month: this.caMonth, topic: this.caTopic, takeaways: this.caTakeaways });
      this.caTopic = ''; this.caTakeaways = ''; this.saveLocalData();
    },
    addEditorialNote() {
      if(!this.edTopic.trim() || !this.edArgs.trim()) return;
      this.editorialNotes.unshift({ id: Date.now(), paper: this.edPaper, topic: this.edTopic, args: this.edArgs });
      this.edTopic = ''; this.edArgs = ''; this.saveLocalData();
    },
    addScheme() {
      if(!this.schName.trim() || !this.schObj.trim()) return;
      this.schemes.unshift({ id: Date.now(), ministry: this.schMin, name: this.schName, objectives: this.schObj });
      this.schName = ''; this.schObj = ''; this.saveLocalData();
    },
    addReport() {
      if(!this.repTitle.trim() || !this.repFindings.trim()) return;
      this.reports.unshift({ id: Date.now(), body: this.repBody, title: this.repTitle, findings: this.repFindings });
      this.repTitle = ''; this.repFindings = ''; this.saveLocalData();
    },
    addDataBankItem() {
      if(!this.dbValue.trim()) return;
      this.dataBank.unshift({ id: Date.now(), cat: this.dbCat, val: this.dbValue, ref: this.dbRef || 'General' });
      this.dbValue = ''; this.dbRef = ''; this.saveLocalData();
    },
    addAnswer() {
      if(!this.ansQ.trim()) return;
      this.answers.unshift({ id: Date.now(), paper: this.ansPaper, question: this.ansQ, status: this.ansStatus });
      this.ansQ = ''; this.saveLocalData();
    },
    addEvalNote() {
      if(!this.evalFeedback.trim()) return;
      this.evalNotes.unshift({ id: Date.now(), source: this.evalSource, feedback: this.evalFeedback });
      this.evalFeedback = ''; this.saveLocalData();
    }
  }"
>

  <div x-show="userAuthenticated" class="min-h-screen flex flex-col relative">
    
    <!-- HEADER -->
    <header class="bg-[#111a36]/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button @click="sidebarOpen = true" class="text-slate-300 hover:text-white focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white">Mission Control v4.5</h1>
          <p class="text-[10px] text-slate-400 font-mono" x-text="formattedDate"></p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <div id="google_translate_element" class="scale-90 origin-right hidden sm:block"></div>
        <button @click="logoutSession()" class="text-[10px] font-mono border border-slate-800 bg-[#0b1329] text-slate-400 px-2 py-1 rounded-md hover:text-red-400 transition">Lock</button>
      </div>
    </header>

    <!-- DRAWER -->
    <div x-show="sidebarOpen" class="fixed inset-0 z-50 flex" x-transition>
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="sidebarOpen = false"></div>
      <div class="relative w-64 max-w-xs bg-[#111a36] h-full flex flex-col border-r border-slate-800 p-4 space-y-6" @click.stop>
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <span class="text-xs font-bold text-white uppercase tracking-wider">Navigation Node</span>
          <button @click="sidebarOpen = false" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <nav class="flex-1 space-y-1">
          <button @click="activeTab = 'dashboard'; sidebarOpen = false" :class="activeTab === 'dashboard' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>📊</span> <span>Dashboard Center</span></button>
          <button @click="activeTab = 'targets'; sidebarOpen = false" :class="activeTab === 'targets' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>🎯</span> <span>Daily & Weekly Targets</span></button>
          <button @click="activeTab = 'ai_arena'; sidebarOpen = false" :class="activeTab === 'ai_arena' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>🤖</span> <span>AI Evaluation Arena</span></button>
          <button @click="activeTab = 'ca_notes'; sidebarOpen = false" :class="activeTab === 'ca_notes' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>📰</span> <span>CA & Editorial Notes</span></button>
          <button @click="activeTab = 'schemes_reports'; sidebarOpen = false" :class="activeTab === 'schemes_reports' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>🏛️</span> <span>Schemes & Reports</span></button>
          <button @click="activeTab = 'databank'; sidebarOpen = false" :class="activeTab === 'databank' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>🗄️</span> <span>Unified Data Bank</span></button>
          <button @click="activeTab = 'writing_eval'; sidebarOpen = false" :class="activeTab === 'writing_eval' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>✍️</span> <span>Writing & Evaluation</span></button>
          <button @click="activeTab = 'subject_track'; sidebarOpen = false" :class="activeTab === 'subject_track' ? 'bg-slate-800 text-amber-400 font-bold' : 'text-slate-300'" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-xs text-left transition"><span>📈</span> <span>Subject Tracking</span></button>
        </nav>
      </div>
    </div>

    <!-- MAIN INTERFACE DESK -->
    <main class="flex-1 p-4 md:p-6 max-w-4xl w-full mx-auto space-y-4">
      
      <!-- TAB 1: INTEGRATED CORE DASHBOARD MATRIX -->
      <div x-show="activeTab === 'dashboard'" x-transition class="space-y-4">
        <div class="bg-gradient-to-r from-amber-950/40 to-slate-900 border border-amber-900/40 p-4 rounded-2xl shadow-xl text-center">
          <span class="text-[9px] font-bold text-amber-500 uppercase tracking-widest font-mono">Countdown to CSE Prelims (23 May 2027)</span>
          <div class="flex justify-center items-center space-x-4 mt-1">
            <div class="text-3xl font-mono font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-300" x-text="countdown.days"></div>
            <div class="text-3xl font-mono font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-300" x-text="countdown.hours"></div>
            <div class="text-3xl font-mono font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-300" x-text="countdown.mins"></div>
          </div>
        </div>
        <div class="bg-[#111a36] border border-slate-800/80 p-3 rounded-xl text-center">
          <p class="text-xs italic text-amber-400/90 font-medium" x-text="'“' + currentQuote + '”'"></p>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="bg-[#111a36] border border-slate-800 p-3 rounded-xl text-center"><p class="text-[9px] text-slate-400 uppercase font-mono">Daily Targets</p><h4 class="text-base font-bold mt-0.5" x-text="dailyTargets.filter(t=>!t.completed).length + ' Active'"></h4></div>
          <div class="bg-[#111a36] border border-slate-800 p-3 rounded-xl text-center"><p class="text-[9px] text-slate-400 uppercase font-mono">Weekly Progress</p><h4 class="text-base font-bold mt-0.5" x-text="weeklyTargets.filter(t=>t.completed).length + '/' + weeklyTargets.length"></h4></div>
          <div class="bg-[#111a36] border border-slate-800 p-3 rounded-xl text-center"><p class="text-[9px] text-slate-400 uppercase font-mono">CA / Editorials</p><h4 class="text-base font-bold mt-0.5" x-text="(caNotes.length + editorialNotes.length) + ' Records'"></h4></div>
          <div class="bg-[#111a36] border border-slate-800 p-3 rounded-xl text-center"><p class="text-[9px] text-slate-400 uppercase font-mono">Answers Logged</p><h4 class="text-base font-bold mt-0.5" x-text="answers.length + ' Papers'"></h4></div>
        </div>
      </div>

      <!-- TAB 2: DAILY & WEEKLY TARGETS -->
      <div x-show="activeTab === 'targets'" x-transition class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-[#111a36] border border-slate-800 p-4 rounded-xl flex flex-col space-y-3">
          <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider font-mono border-b border-slate-800 pb-2">Daily Target Parameters</h2>
          <div class="flex space-x-2">
            <input type="text" x-model="newDailyText" @keydown.enter="addDailyTarget()" placeholder="Add daily objective module..." class="flex-1 bg-[#0b1329] border border-slate-800 rounded-lg p-2 text-xs focus:outline-none">
            <button @click="addDailyTarget()" class="bg-indigo-600 px-3 rounded-lg text-xs font-bold font-mono">ADD</button>
          </div>
          <ul class="space-y-2 overflow-y-auto max-h-64 flex-1">
            <template x-for="t in dailyTargets" :key="t.id">
              <li class="flex items-center justify-between bg-[#0b1329] p-2.5 rounded-lg border border-slate-800 text-xs">
                <div class="flex items-center space-x-2">
                  <input type="checkbox" x-model="t.completed" @change="saveLocalData()" class="rounded border-slate-700 bg-slate-900 text-indigo-600">
                  <span :class="t.completed ? 'line-through text-slate-500' : 'text-slate-300'" x-text="t.text"></span>
                </div>
                <button @click="dailyTargets = dailyTargets.filter(item=>item.id!==t.id); saveLocalData();" class="text-slate-600 hover:text-red-400 font-bold">×</button>
              </li>
