<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Mission Control 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- DESIGN TOKENS --- */
        :root {
            --bg-body: #0f172a; --bg-surface: #1e293b; --bg-surface-hover: #334155;
            --accent-primary: #f59e0b; --accent-primary-hover: #d97706;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
            --status-danger: #ef4444; --radius-md: 8px; --radius-lg: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; line-height: 1.5; }

        /* --- NOSCRIPT WARNING --- */
        .js-warning { background: var(--status-danger); color: white; padding: 1.5rem; text-align: center; font-weight: bold; border-radius: var(--radius-lg); margin: 1.5rem; border: 2px solid white; }

        /* --- LAYOUT --- */
        .sidebar { width: 280px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; transition: transform 0.3s ease; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border-color); }
        .sidebar-header h2 { font-size: 1.1rem; color: var(--text-main); }
        .sidebar-header span { color: var(--accent-primary); font-size: 0.85rem; display: block; font-weight: normal; }
        
        .nav-links { display: flex; flex-direction: column; padding: 1rem 0; }
        .nav-item { padding: 0.75rem 1.5rem; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 12px; border-left: 3px solid transparent; cursor: pointer; font-weight: 500; background: none; border-top: none; border-right: none; border-bottom: none; text-align: left; width: 100%; font-size: 1rem; }
        .nav-item.active { background-color: rgba(245, 158, 11, 0.1); color: var(--accent-primary); border-left-color: var(--accent-primary); }

        .main-content { flex: 1; margin-left: 280px; padding: 2rem; max-width: 900px; }
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
        .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .mobile-menu-btn { display: block; margin-bottom: 1rem; }
            .mobile-overlay.active { display: block; }
        }

        /* --- COMPONENTS --- */
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; }

        .input-group { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
        .input-control { flex: 1; min-width: 150px; padding: 0.75rem; background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main); outline: none; }
        .btn-primary { background: var(--accent-primary); color: #000; border: none; padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }
        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }

        .timer-box { text-align: center; border: 1px solid var(--accent-primary); padding: 1.5rem; border-radius: var(--radius-lg); margin-bottom: 1.5rem; background: rgba(245, 158, 11, 0.05); }
        .timer-title { color: var(--accent-primary); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0.5rem; }
        .timer-time { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { padding: 1.2rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 0.75rem; background: var(--bg-body); }
        .badge { background: var(--border-color); color: var(--text-muted); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-right: 8px; font-weight: 600; }
        .chart-container { position: relative; height: 250px; width: 100%; }
    </style>
</head>
<body>

    <noscript>
        <div class="js-warning">
            ⚠️ SYSTEM ERROR: JAVASCRIPT BLOCKED ⚠️<br><br>
            Your current app is blocking this dashboard from running.<br>
            Please close this viewer, long-press the file, select "Open With...", and choose <b>Google Chrome</b>.
        </div>
    </noscript>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>UPSC Mission Control</h2>
            <span>Foundation Version</span>
        </div>
        <div class="nav-links">
            <button class="nav-item active" data-target="tab-dash">Dashboard</button>
            <button class="nav-item" data-target="tab-mock">Mock Tests</button>
        </div>
    </nav>

    <main class="main-content">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ Menu</button>
        
        <section id="tab-dash" class="tab-pane active">
            <h1 style="margin-bottom: 0.5rem;">Command Center</h1>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;" id="currentDateDisplay">Loading Date...</p>

            <div class="timer-box">
                <div class="timer-title">Target: Prelims (May 23, 2027)</div>
                <div class="timer-time" id="countdownDisplay">Loading Timer...</div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Daily Tasks</div>
                    <div class="stat-value" id="taskStat">0 / 0</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Subject Focus</span></div>
                <div class="chart-container"><canvas id="taskChart"></canvas></div>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Today's Missions</span></div>
                <div class="input-group">
                    <select id="taskExam" class="input-control" onchange="updateSubjectOptions('taskExam', 'taskSubject')">
                        <option value="Prelims">Prelims</option>
                        <option value="Mains">Mains</option>
                    </select>
                    <select id="taskSubject" class="input-control"></select>
                    <input type="text" id="taskInput" class="input-control" placeholder="Specific topic..." style="flex: 2;">
                    <button class="btn-primary" onclick="App.addTask()">Add Task</button>
                </div>
                <div id="taskList"></div>
            </div>
        </section>

        <section id="tab-mock" class="tab-pane">
            <div class="card">
                <div class="card-header"><span class="card-title">Performance Trend</span></div>
                <div class="chart-container"><canvas id="mockChart"></canvas></div>
            </div>
        </section>
    </main>

<script>
    // 0. Emergency Crash Reporter
    window.onerror = function(msg) {
        document.getElementById('countdownDisplay').innerText = "JS CRASH: " + msg;
    };

    // 1. Hardened Local Storage (Prevents corrupted data from crashing the app)
    const DB = {
        get: (key, defaultValue) => {
            try {
                const stored = localStorage.getItem(key);
                if (!stored) return defaultValue;
                const parsed = JSON.parse(stored);
                // If previous data got corrupted (e.g., saved as an object instead of array), reset it.
                if (Array.isArray(defaultValue) && !Array.isArray(parsed)) return defaultValue;
                if (parsed === null) return defaultValue;
                return parsed;
            } catch (e) {
                return defaultValue;
            }
        },
        set: (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        }
    };

    const State = {
        tasks: DB.get('upsc_tasks', []),
        mocks: DB.get('upsc_mocks', [])
    };

    let chartInstances = { task: null, mock: null };

    const Subjects = {
        Prelims: ["History", "Polity", "Economy", "Geography", "Environment", "Science", "CSAT"],
        Mains: ["GS 1", "GS 2", "GS 3", "GS 4", "Optional Subject", "Essay"]
    };

    // --- UI NAVIGATION ---
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const targetId = e.target.getAttribute('data-target');
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');
            
            if (window.innerWidth <= 768) toggleSidebar();
            App.renderCharts();
        });
    });

    function updateSubjectOptions(examSelectId, subjectSelectId) {
        try {
            const exam = document.getElementById(examSelectId).value;
            const subSelect = document.getElementById(subjectSelectId);
            if (Subjects[exam] && subSelect) {
                subSelect.innerHTML = Subjects[exam].map(sub => `<option value="${sub}">${sub}</option>`).join('');
            }
        } catch(e) { console.error("Dropdown error:", e); }
    }

    // --- MAIN LOGIC ---
    const App = {
        initTimer: () => {
            try {
                // Safe date fetch
                document.getElementById('currentDateDisplay').innerText = new Date().toDateString();
            } catch(e) {}
            
            const targetDate = new Date(2027, 4, 23).getTime(); 
            const calculateTime = () => {
                const now = new Date().getTime();
                const diff = targetDate - now;
                if (diff < 0) return document.getElementById('countdownDisplay').innerText = "0d 0h 0m";
                
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                document.getElementById('countdownDisplay').innerText = `${d}d ${h}h ${m}m`;
            };
            calculateTime();
            setInterval(calculateTime, 60000);
        },

        addTask: () => {
            try {
                const text = document.getElementById('taskInput').value.trim();
                const subject = document.getElementById('taskSubject').value;
                if (!text) return;

                State.tasks.push({ text, subject, done: false, id: Date.now() });
                DB.set('upsc_tasks', State.tasks);
                document.getElementById('taskInput').value = '';
                App.renderTasks();
                App.renderCharts();
            } catch(e) { alert("Error adding task: " + e.message); }
        },

        toggleTask: (id) => {
            const task = State.tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; DB.set('upsc_tasks', State.tasks); App.renderTasks(); }
        },

        deleteTask: (id) => {
            State.tasks = State.tasks.filter(t => t.id !== id);
            DB.set('upsc_tasks', State.tasks);
            App.renderTasks();
            App.renderCharts();
        },

        renderTasks: () => {
            const list = document.getElementById('taskList');
            list.innerHTML = State.tasks.map(t => `
                <div class="list-item">
                    <div style="display:flex; align-items:center; gap:10px; ${t.done ? 'opacity:0.5; text-decoration:line-through;' : ''}">
                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="App.toggleTask(${t.id})">
                        <span><span class="badge">${t.subject}</span> ${t.text}</span>
                    </div>
                    <button class="btn-icon" onclick="App.deleteTask(${t.id})">✕</button>
                </div>
            `).join('');

            const completed = State.tasks.filter(t => t.done).length;
            document.getElementById('taskStat').innerText = `${completed} / ${State.tasks.length}`;
        },

        renderCharts: () => {
            try {
                const taskCtx = document.getElementById('taskChart');
                if (taskCtx && window.getComputedStyle(taskCtx.parentElement.parentElement).display !== 'none') {
                    if (chartInstances.task) chartInstances.task.destroy();
                    const subjs = {};
                    State.tasks.forEach(t => subjs[t.subject] = (subjs[t.subject] || 0) + 1);
                    chartInstances.task = new Chart(taskCtx, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(subjs).length ? Object.keys(subjs) : ['None'],
                            datasets: [{ data: Object.keys(subjs).length ? Object.values(subjs) : [1], backgroundColor: ['#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ef4444', '#1e293b'], borderWidth: 0 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#f8fafc' } } } }
                    });
                }
            } catch(e) { console.error("Chart Error", e); }
        },

        boot: () => {
            updateSubjectOptions('taskExam', 'taskSubject');
            App.initTimer();
            App.renderTasks();
            App.renderCharts();
        }
    };

    // Safe Bootloader
    document.addEventListener('DOMContentLoaded', () => {
        try { App.boot(); } 
        catch(e) { document.getElementById('countdownDisplay').innerText = "Boot Error: " + e.message; }
    });
</script>
</body>
</html>
