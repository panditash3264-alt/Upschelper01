<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #e0e7ff;
            --bg-body: #f8fafc; --surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --accent: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); padding: 2rem 1rem; display: flex; justify-content: center; }
        .container { max-width: 1100px; width: 100%; }
        
        /* Navigation */
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.2rem; margin-bottom: 1rem; }
        h1 span { color: var(--primary); }
        .nav-menu { display: flex; gap: 0.5rem; justify-content: center; background: var(--surface); padding: 0.5rem; border-radius: 12px; border: 1px solid var(--border); flex-wrap: wrap; }
        .nav-btn { background: transparent; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted); }
        .nav-btn.active { background: var(--primary); color: white; }
        
        /* View Management */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Cards & Inputs */
        .card { background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .card h2 { font-size: 1.25rem; margin-bottom: 1.2rem; }
        .input-group { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
        input, select, textarea { flex: 1; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        button.action-btn { padding: 0.8rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .delete-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }
        .delete-btn:hover { color: var(--danger); }
        
        /* Layouts */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .list-item { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.8rem; border-left: 4px solid var(--primary); }
        
        /* Badges & Timers */
        .badge { background: var(--primary-light); color: var(--primary-hover); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .timer-box { background: var(--primary-light); padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1rem; }
        .time-display { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        
        /* Syllabus Accordion */
        .acc-btn { width: 100%; text-align: left; padding: 1rem; background: transparent; border: none; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--border); }
        .acc-content { display: none; padding: 1rem; background: var(--bg-body); }
        .acc-content.show { display: block; }
        .topic-list li { display: flex; align-items: center; gap: 10px; padding: 0.5rem 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>UPSC <span>Command Center</span></h1>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="switchTab('tab-dash', this)">Dashboard</button>
            <button class="nav-btn" onclick="switchTab('tab-syl', this)">Syllabus</button>
            <button class="nav-btn" onclick="switchTab('tab-ca', this)">Current Affairs</button>
            <button class="nav-btn" onclick="switchTab('tab-mock', this)">Mocks</button>
            <button class="nav-btn" onclick="switchTab('tab-rev', this)">Revision</button>
        </div>
    </header>

    <!-- DASHBOARD -->
    <div id="tab-dash" class="view-section active">
        <div class="grid-2">
            <div class="card">
                <h2>⏳ Exams</h2>
                <div class="timer-box"><div id="t-pre">Loading...</div><small>Prelims</small></div>
                <div class="timer-box"><div id="t-main">Loading...</div><small>Mains</small></div>
            </div>
            <div class="card">
                <h2>🎯 Daily Targets</h2>
                <div class="input-group">
                    <input type="text" id="task-in" placeholder="New target...">
                    <button class="action-btn" onclick="addTask()">Add</button>
                </div>
                <div id="task-list"></div>
            </div>
        </div>
    </div>

    <!-- SYLLABUS -->
    <div id="tab-syl" class="view-section">
        <div class="card">
            <h2>📚 GS Syllabus Tracker <span id="syl-prog" style="float:right; color:var(--primary);">0%</span></h2>
            <button class="acc-btn" onclick="toggleAcc(this)">GS 1: History, Culture & Geo ▼</button>
            <div class="acc-content show">
                <ul class="topic-list" id="syl-1">
                    <li><input type="checkbox" id="g1a" onchange="saveSyl()"><label>Indian Culture & Art</label></li>
                    <li><input type="checkbox" id="g1b" onchange="saveSyl()"><label>Modern Indian History</label></li>
                    <li><input type="checkbox" id="g1c" onchange="saveSyl()"><label>World Geography</label></li>
                </ul>
            </div>
            <button class="acc-btn" onclick="toggleAcc(this)">GS 2: Polity & Governance ▼</button>
            <div class="acc-content">
                <ul class="topic-list" id="syl-2">
                    <li><input type="checkbox" id="g2a" onchange="saveSyl()"><label>Constitution & Basic Structure</label></li>
                    <li><input type="checkbox" id="g2b" onchange="saveSyl()"><label>Parliament & Legislature</label></li>
                    <li><input type="checkbox" id="g2c" onchange="saveSyl()"><label>International Relations</label></li>
                </ul>
            </div>
            <button class="acc-btn" onclick="toggleAcc(this)">GS 3: Economy & Env ▼</button>
            <div class="acc-content">
                <ul class="topic-list" id="syl-3">
                    <li><input type="checkbox" id="g3a" onchange="saveSyl()"><label>Indian Economy</label></li>
                    <li><input type="checkbox" id="g3b" onchange="saveSyl()"><label>Environment & Disaster Mgmt</label></li>
                    <li><input type="checkbox" id="g3c" onchange="saveSyl()"><label>Science & Tech</label></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- CURRENT AFFAIRS -->
    <div id="tab-ca" class="view-section">
        <div class="card">
            <h2>📰 Log Current Affair</h2>
            <div class="input-group">
                <input type="text" id="ca-title" placeholder="Headline">
                <select id="ca-paper" style="flex:0.3"><option>GS1</option><option>GS2</option><option>GS3</option><option>GS4</option></select>
            </div>
            <div class="input-group">
                <input type="text" id="ca-tags" placeholder="Tags (e.g. #Polity)">
                <button class="action-btn" onclick="addCA()">Save Log</button>
            </div>
        </div>
        <div id="ca-list"></div>
    </div>

    <!-- MOCKS -->
    <div id="tab-mock" class="view-section">
        <div class="card">
            <h2>📝 Log Mock Test</h2>
            <div class="input-group">
                <input type="text" id="m-name" placeholder="Test Name">
                <select id="m-type" style="flex:0.4"><option>Prelims</option><option>Mains</option></select>
                <input type="number" id="m-score" placeholder="Score" style="flex:0.3">
            </div>
            <div class="input-group">
                <textarea id="m-journal" placeholder="Mistakes made..."></textarea>
                <button class="action-btn" onclick="addMock()">Save</button>
            </div>
        </div>
        <div id="mock-list"></div>
    </div>

    <!-- REVISION -->
    <div id="tab-rev" class="view-section">
        <div class="card">
            <h2>🧠 Schedule Revision</h2>
            <div class="input-group">
                <input type="text" id="r-topic" placeholder="Topic finished today">
                <input type="date" id="r-date">
                <button class="action-btn" onclick="addRev()">Schedule</button>
            </div>
        </div>
        <div id="rev-list"></div>
    </div>
</div>

<script>
    // Utility for LocalStorage (prevents repeated code)
    const store = {
        get: (k, def) => JSON.parse(localStorage.getItem(k)) || def,
        set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
    };

    // Tab Switching
    function switchTab(id, btn) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    // 1. Timers
    const examDates = { pre: new Date("May 30, 2027").getTime(), main: new Date("Sep 15, 2027").getTime() };
    setInterval(() => {
        const now = new Date().getTime();
        ['pre', 'main'].forEach(key => {
            const diff = examDates[key] - now;
            document.getElementById(`t-${key}`).innerText = diff < 0 ? "Exam Day!" : 
                `${Math.floor(diff/(1000*60*60*24))}d ${Math.floor((diff/(1000*60*60))%24)}h`;
        });
    }, 1000);

    // 2. Daily Targets
    let tasks = store.get('up_tasks', []);
    const renderTasks = () => {
        document.getElementById('task-list').innerHTML = tasks.map((t, i) => `
            <div class="list-item" style="display:flex; justify-content:space-between; ${t.done ? 'opacity:0.5; text-decoration:line-through;' : ''}">
                <span onclick="tasks[${i}].done=!tasks[${i}].done; store.set('up_tasks', tasks); renderTasks()" style="cursor:pointer; flex:1;">${t.txt}</span>
                <button class="delete-btn" onclick="tasks.splice(${i},1); store.set('up_tasks', tasks); renderTasks()">✖</button>
            </div>
        `).join('');
    };
    function addTask() {
        const val = document.getElementById('task-in').value.trim();
        if(val) { tasks.push({txt: val, done: false}); store.set('up_tasks', tasks); document.getElementById('task-in').value=''; renderTasks(); }
    }
    renderTasks();

    // 3. Syllabus
    function toggleAcc(btn) { btn.nextElementSibling.classList.toggle('show'); }
    const sylState = store.get('up_syl', {});
    document.querySelectorAll('.topic-list input').forEach(chk => {
        if(sylState[chk.id]) chk.checked = true;
    });
    function saveSyl() {
        const checks = document.querySelectorAll('.topic-list input');
        let done = 0;
        checks.forEach(c => { sylState[c.id] = c.checked; if(c.checked) done++; });
        store.set('up_syl', sylState);
        document.getElementById('syl-prog').innerText = Math.round((done / checks.length) * 100) + '%';
    }
    saveSyl(); // init percentage

    // 4. Current Affairs
    let cas = store.get('up_cas', []);
    const renderCAs = () => {
        document.getElementById('ca-list').innerHTML = cas.map((ca, i) => `
            <div class="card list-item">
                <div style="display:flex; justify-content:space-between;">
                    <strong><span class="badge">${ca.p}</span> ${ca.t}</strong>
                    <button class="delete-btn" onclick="cas.splice(${i},1); store.set('up_cas', cas); renderCAs()">✖</button>
                </div>
                <small style="color:var(--text-muted)">${ca.tags}</small>
            </div>
        `).reverse().join('');
    };
    function addCA() {
        const t = document.getElementById('ca-title').value, p = document.getElementById('ca-paper').value, tags = document.getElementById('ca-tags').value;
        if(t) { cas.push({t, p, tags}); store.set('up_cas', cas); document.getElementById('ca-title').value=''; document.getElementById('ca-tags').value=''; renderCAs(); }
    }
    renderCAs();

    // 5. Mocks
    let mocks = store.get('up_mocks', []);
    const renderMocks = () => {
        document.getElementById('mock-list').innerHTML = mocks.map((m, i) => `
            <div class="card list-item" style="border-left-color:var(--warning)">
                <div style="display:flex; justify-content:space-between;">
                    <strong><span class="badge">${m.type}</span> ${m.name}</strong>
                    <span>Score: ${m.score} <button class="delete-btn" onclick="mocks.splice(${i},1); store.set('up_mocks', mocks); renderMocks()">✖</button></span>
                </div>
                <p style="margin-top:10px; font-size:0.9rem;">${m.j}</p>
            </div>
        `).reverse().join('');
    };
    function addMock() {
        const n = document.getElementById('m-name').value, t = document.getElementById('m-type').value, s = document.getElementById('m-score').value, j = document.getElementById('m-journal').value;
        if(n) { mocks.push({name:n, type:t, score:s, j}); store.set('up_mocks', mocks); document.getElementById('m-name').value=''; document.getElementById('m-score').value=''; document.getElementById('m-journal').value=''; renderMocks(); }
    }
    renderMocks();

    // 6. Revision
    let revs = store.get('up_revs', []);
    document.getElementById('r-date').valueAsDate = new Date();
    const addDays = (d, days) => { let nd = new Date(d); nd.setDate(nd.getDate() + days); return nd.toLocaleDateString(); };
    
    const renderRevs = () => {
        document.getElementById('rev-list').innerHTML = revs.map((r, i) => `
            <div class="card list-item" style="border-left-color:#8b5cf6">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <strong>${r.topic}</strong>
                    <button class="delete-btn" onclick="revs.splice(${i},1); store.set('up_revs', revs); renderRevs()">✖</button>
                </div>
                <div style="display:flex; gap:10px; font-size:0.85rem;">
                    <label><input type="checkbox" ${r.d7 ? 'checked' : ''} onclick="revs[${i}].d7=!revs[${i}].d7; store.set('up_revs', revs)"> 7D: ${r.t7}</label>
                    <label><input type="checkbox" ${r.d30 ? 'checked' : ''} onclick="revs[${i}].d30=!revs[${i}].d30; store.set('up_revs', revs)"> 30D: ${r.t30}</label>
                </div>
            </div>
        `).reverse().join('');
    };
    function addRev() {
        const top = document.getElementById('r-topic').value, d = document.getElementById('r-date').value;
        if(top && d) { revs.push({ topic:top, t7:addDays(d,7), d7:false, t30:addDays(d,30), d30:false }); store.set('up_revs', revs); document.getElementById('r-topic').value=''; renderRevs(); }
    }
    renderRevs();
</script>
</body>
</html>
